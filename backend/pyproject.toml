[project]
name = "stormleads-backend"
version = "6.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "apscheduler>=3.10",
    "geopandas>=1.0",
    "h3>=3.7",
    "shapely>=2.0",
    "httpx>=0.28",
    "rasterio>=1.4",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "boto3>=1.35",
    "upstash-redis>=1",
    "watchtower>=3",
    "python-dotenv>=1.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.uv]
python-preference = "only-managed"
